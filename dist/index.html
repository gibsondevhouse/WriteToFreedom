<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore Wikipedia in your language. A custom portal with an original African-inspired crest.">
  <meta name="color-scheme" content="dark"><title>Wikipedia — Crest Portal</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101820'/%3E%3Cpath d='M16 5 26 9Q25 22 16 28 7 22 6 9Z' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='m16 10 5 6-5 6-5-6Z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css"><script src="app.js" defer></script>
</head>
<body>
<main>
  <header class="wordmark"><h1>Wikipedia</h1><p>The Free Encyclopedia</p></header>
  <nav class="portal" aria-label="Top languages">
    <img class="crest" src="crest.svg" width="200" height="217" alt="Original African-inspired white shield crest">
    <a class="language lang-1" href="https://en.wikipedia.org/" lang="en"><strong>English</strong><span>7,237,000+ articles</span></a>
    <a class="language lang-2" href="https://ja.wikipedia.org/" lang="ja"><strong>日本語</strong><span>1,517,000+ 記事</span></a>
    <a class="language lang-3" href="https://de.wikipedia.org/" lang="de"><strong>Deutsch</strong><span>3.150.000+ Artikel</span></a>
    <a class="language lang-4" href="https://fr.wikipedia.org/" lang="fr"><strong>Français</strong><span>2 778 000+ articles</span></a>
    <a class="language lang-5" href="https://ru.wikipedia.org/" lang="ru"><strong>Русский</strong><span>2 117 000+ статей</span></a>
    <a class="language lang-6" href="https://es.wikipedia.org/" lang="es"><strong>Español</strong><span>2.136.000+ artículos</span></a>
    <a class="language lang-7" href="https://it.wikipedia.org/" lang="it"><strong>Italiano</strong><span>1.986.000+ voci</span></a>
    <a class="language lang-8" href="https://zh.wikipedia.org/" lang="zh"><strong>中文</strong><span>1,554,000+ 条目 / 條目</span></a>
    <a class="language lang-9" href="https://pl.wikipedia.org/" lang="pl"><strong>Polski</strong><span>1 707 000+ haseł</span></a>
    <a class="language lang-10" href="https://pt.wikipedia.org/" lang="pt"><strong>Português</strong><span>1.181.000+ artigos</span></a>
  </nav>
  <form class="search" action="https://en.wikipedia.org/w/index.php" method="get" role="search">
    <div class="search-field"><label class="sr-only" for="query">Search Wikipedia</label><input id="query" name="search" type="search" autocomplete="off" required>
    <div class="select-wrap"><span id="language-code" aria-hidden="true">EN</span><label class="sr-only" for="search-language">Search language</label><select id="search-language"></select><svg aria-hidden="true" viewBox="0 0 16 16"><path d="m3 6 5 5 5-5"/></svg></div></div>
    <button class="search-button" aria-label="Search" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="m16 16 6 6"/></svg></button>
  </form>
  <div class="language-toggle-row"><span class="rule"></span><button id="language-toggle" aria-expanded="false" aria-controls="all-languages"><svg class="translate" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5h13M8 2v3M12 5c-1 6-4 10-9 13M4 8c2 4 5 7 9 9M14 21l4-12 4 12M15.5 17h5"/></svg><span>Read Wikipedia in your language</span><svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m3 6 5 5 5-5"/></svg></button><span class="rule"></span></div>
  <section id="all-languages" aria-label="All languages" hidden><div class="all-language-links"></div></section>
</main>
</body>
</html>
