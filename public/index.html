<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Dashboard — Write to Freedom</title>
  <meta name="description" content="Your writing workspace: characters, factions, places, open questions, and story dates.">
  <link rel="icon" href="/crest.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/dashboard/dashboard.css">
  <link rel="stylesheet" href="/styles.css?v=shared-1">
  <link rel="stylesheet" href="/dashboard/character-cards.css?v=4">
  <script src="/dashboard/dashboard.js?v=character-cards-4" type="module"></script>
</head>
<body class="workspace">
  <a class="skip-link" href="#dashboard">Skip to dashboard</a>
    <main id="dashboard" tabindex="-1">
      <div class="workspace-heading"><div><p class="workspace-eyebrow">Overview</p><h1>Your novel at a glance</h1></div><a class="workspace-action" href="/characters/">Open characters <span aria-hidden="true">↗</span></a></div>
      <div id="dashboard-content">
        <p id="load-status" class="load-status" role="status">Loading your novel…</p>
        <div id="load-error" class="load-error" role="alert" hidden><p></p><button type="button" id="retry">Try again</button></div>
        <div id="dashboard-rows" aria-busy="true"></div>
      </div>
      <noscript><p>Enable JavaScript to load your overview. Your directories are available from the navigation.</p></noscript>
    </main>
</body>
</html>
