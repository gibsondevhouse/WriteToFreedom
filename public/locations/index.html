<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Explore the locations, countries, cities, and landmarks in your novel.">
  <title>Locations — Write to Freedom</title>
  <link rel="icon" href="../crest.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/characters/characters.css">
  <link rel="stylesheet" href="locations.css"><script src="locations.js" type="module"></script>
</head>
<body>
  <header class="site-header"><a class="brand" href="../"><img src="../crest.svg" width="32" height="36" alt=""><span>Write to Freedom</span></a><a class="home-link" href="../">← Home</a></header>
  <main>
    <section class="page-heading" aria-labelledby="page-title">
      <p class="eyebrow">PLACES &amp; GEOGRAPHY</p>
      <h1 id="page-title">Locations</h1>
      <p class="intro">Countries, cities, and the landmarks within them.</p>
      <p class="seed-note"><button id="new-location" class="new-character-button" type="button"><span aria-hidden="true">+</span> New location</button></p>
      <p id="storage-error" role="alert" hidden></p><button id="retry-load" type="button" hidden>Try again</button>
    </section>
    <section class="cast" aria-label="Location directory">
      <div class="search-row"><label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg><span class="sr-only">Search locations</span><input id="location-search" type="search" placeholder="Search locations, cities, countries…" autocomplete="off"></label><button id="clear-search" type="button" hidden>Clear search</button></div>
      <div class="type-filters" role="group" aria-label="Filter location types"><button type="button" data-type="" aria-pressed="true">All locations</button><button type="button" data-type="landmark" aria-pressed="false">Landmarks</button><button type="button" data-type="city" aria-pressed="false">Cities</button><button type="button" data-type="country" aria-pressed="false">Countries</button></div><div class="list-toolbar"><p id="result-count" role="status" aria-live="polite">Loading locations…</p><div class="sort-controls"><label class="sr-only" for="sort-order">Sort locations</label><select id="sort-order"><option value="order">List order</option><option value="name">Alphabetical</option><option value="type">Location type</option></select><button id="sort-direction" type="button" aria-label="Reverse list order" aria-pressed="false" title="Reverse list order"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16m-4-4 4 4 4-4M17 20V4m-4 4 4-4 4 4"/></svg></button></div></div>
      <ol id="location-list" class="character-list"></ol>
      <div id="empty-state" class="empty-state" hidden><h2>No locations found</h2><p>Try a location, city, or country.</p><button id="reset-search" type="button">Show all locations</button></div>
      <noscript><p>This location list needs JavaScript enabled. <a href="../">Return home</a>.</p></noscript>
      
    </section>
  </main>
<dialog id="new-location-dialog" aria-labelledby="dialog-title"><form id="new-location-form"><h2 id="dialog-title">New location</h2><p class="dialog-hint">Place it in your world.</p><fieldset id="location-fields"><label for="location-type">Type</label><select id="location-type" name="type"><option value="country">Country</option><option value="city">City</option><option value="landmark">Landmark</option></select><label for="location-name">Name</label><input id="location-name" name="name" maxlength="160" autocomplete="off" required><div id="parent-field" hidden><label id="parent-label" for="location-parent">Country</label><select id="location-parent" name="parentId"></select><p id="parent-hint" class="dialog-hint"></p></div></fieldset><p id="create-error" role="alert" hidden></p><div class="dialog-actions"><button id="cancel-location" type="button">Cancel</button><button id="save-location" class="new-character-button" type="submit">Add location</button></div></form></dialog></body>
</html>
